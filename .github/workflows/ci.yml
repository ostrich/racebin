name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      - name: Verify API contract and generated types
        run: npm run check:api
        working-directory: web
      - name: Verify frontend API boundary
        run: npm run check:api-boundary
        working-directory: web
      - name: Verify CSS architecture
        run: npm run check:css
        working-directory: web
      - name: Build embedded frontend
        run: npm run build
        working-directory: web
      - name: Verify generated frontend is current
        run: |
          git diff --exit-code -- web/dist
          test -z "$(git ls-files --others --exclude-standard web/dist)"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Run unit tests and deterministic browser gate
        run: npm run test:unit && npm run test:e2e:gate
        working-directory: web
      - name: Summarize browser gate failures
        if: failure()
        run: node scripts/summarize-playwright-results.mjs
      - name: Build the application stack
        run: cargo build --locked
      - name: Smoke-test the compiled frontend and disposable backend
        run: npm run test:real
        working-directory: web
      - name: Summarize real-stack failures
        if: failure()
        run: node scripts/summarize-playwright-results.mjs
      - name: Upload Playwright failure details
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-functional-failure-details
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  broad-frontend:
    name: Broad frontend (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Run the complete functional browser suite
        run: npm run test:e2e
        working-directory: web
      - name: Summarize broad browser failures
        if: failure()
        run: node scripts/summarize-playwright-results.mjs
      - name: Upload broad-suite failure details
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-nightly-failure-details
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: Visual regression
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      - name: Run visual regression tests
        run: npm run test:visual
        working-directory: web
      - name: Summarize visual failures
        if: failure()
        run: node scripts/summarize-playwright-results.mjs
      - name: Upload visual failure details
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-visual-failure-details
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: racebin_test
          POSTGRES_PASSWORD: racebin
          POSTGRES_USER: racebin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U racebin -d racebin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RACEBIN_TEST_POSTGRES_URL: postgresql://racebin:racebin@localhost:5432/racebin_test
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check naming conventions
        run: sh scripts/check-naming.sh
      - name: Check Rust formatting
        run: cargo fmt -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run Rust tests
        run: cargo test --locked --all-features
