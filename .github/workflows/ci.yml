name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: racebin_test
          POSTGRES_PASSWORD: racebin
          POSTGRES_USER: racebin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U racebin -d racebin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RACEBIN_TEST_POSTGRES_URL: postgresql://racebin:racebin@localhost:5432/racebin_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: sh scripts/check-naming.sh
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
