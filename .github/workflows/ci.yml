name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      api: ${{ steps.classify.outputs.api }}
      real_stack: ${{ steps.classify.outputs.real_stack }}
      visual: ${{ steps.classify.outputs.visual }}
      broad: ${{ steps.classify.outputs.broad }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test change classification
        run: scripts/test-classify-ci-paths.sh
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch)
              printf '%s\n' \
                'backend=true' \
                'frontend=true' \
                'api=true' \
                'real_stack=true' \
                'visual=true' \
                'broad=true' >> "$GITHUB_OUTPUT"
              ;;
            schedule)
              printf '%s\n' \
                'backend=false' \
                'frontend=false' \
                'api=false' \
                'real_stack=false' \
                'visual=false' \
                'broad=true' >> "$GITHUB_OUTPUT"
              ;;
            *)
              base=$PUSH_BASE
              [ "$EVENT_NAME" = pull_request ] && base=$PULL_REQUEST_BASE
              git diff --name-only "$base" "$GITHUB_SHA" \
                | scripts/classify-ci-paths.sh >> "$GITHUB_OUTPUT"
              printf '%s\n' 'broad=false' >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Summarize selection
        run: |
          {
            printf '### CI selection\n\n'
            printf '| Suite | Run |\n| --- | --- |\n'
            printf '| Backend and PostgreSQL | %s |\n' '${{ steps.classify.outputs.backend }}'
            printf '| Frontend | %s |\n' '${{ steps.classify.outputs.frontend }}'
            printf '| API contract | %s |\n' '${{ steps.classify.outputs.api }}'
            printf '| Real stack | %s |\n' '${{ steps.classify.outputs.real_stack }}'
            printf '| Visual regression | %s |\n' '${{ steps.classify.outputs.visual }}'
            printf '| Broad browser suite | %s |\n' '${{ steps.classify.outputs.broad }}'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.real_stack == 'true'
      - name: Restore Cargo build cache
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.real_stack == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-stable-frontend-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'build.rs', 'src/**/*.rs', 'tests/**/*.rs', 'migrations/**/*', 'web/dist/**/*') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-frontend-${{ hashFiles('Cargo.lock') }}-
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      - name: Verify API contract and generated types
        if: needs.changes.outputs.api == 'true'
        run: npm run check:api
        working-directory: web
      - name: Verify frontend API boundary
        run: npm run check:api-boundary
        working-directory: web
      - name: Verify frontend formatting
        run: npm run check:format
        working-directory: web
      - name: Verify CSS architecture
        run: npm run check:css
        working-directory: web
      - name: Build embedded frontend
        run: npm run build
        working-directory: web
      - name: Verify generated frontend is current
        run: |
          git diff --exit-code -- web/dist
          test -z "$(git ls-files --others --exclude-standard web/dist)"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Run unit tests and deterministic browser gate
        run: npm run test:unit && npm run test:e2e:gate
        working-directory: web
      - name: Summarize browser gate failures
        if: failure()
        run: node scripts/summarize-playwright-results.mjs
      - name: Build the application stack
        if: needs.changes.outputs.real_stack == 'true'
        run: cargo build --locked
      - name: Smoke-test the compiled frontend and disposable backend
        if: needs.changes.outputs.real_stack == 'true'
        env:
          RACEBIN_REAL_STACK_PREBUILT: true
        run: npm run test:real
        working-directory: web
      - name: Summarize real-stack failures
        if: failure()
        run: node scripts/summarize-playwright-results.mjs
      - name: Upload Playwright failure details
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-functional-failure-details
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  broad-frontend:
    name: Broad frontend (nightly)
    needs: changes
    if: needs.changes.outputs.broad == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Run the complete functional browser suite
        run: npm run test:e2e
        working-directory: web
      - name: Summarize broad browser failures
        if: failure()
        run: node scripts/summarize-playwright-results.mjs
      - name: Upload broad-suite failure details
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-nightly-failure-details
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: Visual regression
    needs: [changes, frontend]
    if: always() && needs.changes.outputs.visual == 'true' && needs.frontend.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      - name: Run visual regression tests
        run: npm run test:visual
        working-directory: web
      - name: Summarize visual failures
        if: failure()
        run: node scripts/summarize-playwright-results.mjs
      - name: Upload visual failure details
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-visual-failure-details
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: racebin_test
          POSTGRES_PASSWORD: racebin
          POSTGRES_USER: racebin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U racebin -d racebin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RACEBIN_TEST_POSTGRES_URL: postgresql://racebin:racebin@localhost:5432/racebin_test
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Restore Cargo build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-stable-rust-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'build.rs', 'src/**/*.rs', 'tests/**/*.rs', 'migrations/**/*') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-rust-${{ hashFiles('Cargo.lock') }}-
      - name: Check naming conventions
        run: sh scripts/check-naming.sh
      - name: Check Rust formatting
        run: cargo fmt -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run Rust tests
        run: cargo test --locked --all-features

  dependency-audit:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.broad == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Audit production frontend dependencies
        working-directory: web
        run: npm audit --omit=dev
