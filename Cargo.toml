[package]
name = "racebin"
version = "0.1.0"
edition = "2021"
authors = ["Racebin contributors"]
license = "MIT"
description = "API-first, self-hosted paste bin and file share."
readme = "README.md"
repository = "https://github.com/ostrich/racebin"
keywords = ["pastebin", "filesharing", "racebin", "actix", "selfhosted"]


[dependencies]
actix-files = "0.6.6"
actix-multipart = "0.8"
actix-web = { version = "=4.14.1", default-features = false, features = [
"compat", "compress-brotli", "compress-gzip", "cookies", "macros", "unicode"] }
ammonia = "4.1.3"
argon2 = "0.5"
clap = { version = "4.6", features = ["derive", "env"] }
env_logger = "0.11"
futures = "0.3"
html5ever = "0.39"
log = "0.4.21"
mime_guess = "2.0.4"
markup5ever_rcdom = "0.39"
qrcode-generator = "6"
rand = "0.10"
rpassword = "7.3"
sqlx = { version = "0.9", default-features = false, features = [
"runtime-tokio", "tls-rustls", "any", "sqlite", "postgres", "migrate", "macros"] }
serde_json = "1.0.114"
serde = { version = "1.0.197", features = ["derive"] }
serde_urlencoded = "0.7"
sha2 = "0.11"
tempfile = "3"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread"] }
time = { version = "0.3.55", features = ["formatting", "parsing"] }
utoipa = { version = "5.5", features = ["actix_extras"] }
comrak = { version = "0.54.0", default-features = false }

[dev-dependencies]
proptest = "1.11"

[profile.release]
lto = true
strip = true
